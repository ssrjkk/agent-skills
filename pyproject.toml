[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-skills-library"
version = "3.4.0"
description = "59 curated bilingual (EN+RU) skills in the universal Agent Skills format for Claude Code, OpenCode, Cursor, Windsurf and every LLM/GLM agent. Python SDK + CLI with CI-enforced validation and quality scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ssrjkk", email = "ray013lefe@gmail.com" }]
keywords = ["claude-code", "skills", "agent-skills", "ai-agents", "llm", "mcp", "opencode", "cursor", "windsurf", "bilingual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "colorama>=0.4.6,<1.0",
    "click>=8.1,<9.0",
]

[project.urls]
Source = "https://github.com/ssrjkk/claude-skills"
Documentation = "https://ssrjkk.github.io/claude-skills/"
"Bug Tracker" = "https://github.com/ssrjkk/claude-skills/issues"
Discussions = "https://github.com/ssrjkk/claude-skills/discussions"
Roadmap = "https://github.com/ssrjkk/claude-skills/blob/main/ROADMAP.md"
PyPI = "https://pypi.org/project/claude-skills-library/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
claude-skills = "claude_skills.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_skills = ["py.typed"]