name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Structural validation
        run: python -m claude_skills.cli validate --dir .claude/skills

      - name: Quality analysis
        run: python -m claude_skills.cli quality --dir .claude/skills --json quality-report.json

      - name: Generate catalog
        run: python -m claude_skills.cli catalog

      - name: Anti-pattern detection
        run: python scripts/detect_anti_patterns.py skills_catalog.json

      - name: Agent-interop compatibility (universal format)
        run: python scripts/check_agent_interop.py

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=src/claude_skills --cov-report=term-missing

      - name: Verify package builds
        run: |
          pip install build
          python -m build
          twine check dist/*

      - name: Verify GitHub Action Docker image builds
        run: docker build -t claude-skills-action:test .

      - name: Build documentation site
        run: python scripts/build_docs.py --catalog skills_catalog.json --output-dir docs

      - name: Verify catalog consistency
        run: |
          python -c "
          import json, os
          with open('skills_catalog.json') as f:
              data = json.load(f)
          total = data['metadata']['total_skills']
          skills_count = len(data['skills'])
          assert skills_count == total, f'Mismatch: {skills_count} vs {total}'
          missing = []
          for s in data['skills']:
              p = f'.claude/skills/{s[\"category\"]}/{s[\"name\"]}/SKILL.md'
              if not os.path.exists(p):
                  missing.append(p)
          if missing:
              print(f'Missing {len(missing)}: {missing[:5]}')
              exit(1)
          print(f'All {skills_count} skills verified on disk')
          print(f'Domains: {len(data[\"metadata\"][\"domains\"])}')
          print(f'RU skills: {data[\"metadata\"][\"total_ru\"]}')
          "

      - name: Benchmark validation speed
        run: |
          python -c "
          import time, subprocess
          start = time.time()
          subprocess.run(['python', '-m', 'claude_skills.cli', 'validate', '--dir', '.claude/skills'], check=True)
          elapsed = time.time() - start
          print(f'Validation benchmark: {elapsed:.2f}s')
          "

  deploy-pages:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
