apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: production-microservices
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/org/gitops-infra.git
        revision: main
        directories:
          - path: workloads/production/*
  template:
    metadata:
      name: '{{path.basename}}-prod'
    spec:
      project: default
      source:
        repoURL: https://github.com/org/gitops-infra.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
