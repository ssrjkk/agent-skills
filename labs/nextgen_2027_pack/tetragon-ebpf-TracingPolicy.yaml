# eBPF Runtime Security (Cilium Tetragon): мгновенное убийство процесса (SIGKILL) на уровне ядра,
# если контейнер в продакшене пытается прочитать /etc/shadow или запустить несанкционированный бинарник
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-sensitive-file-reads
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
          matchActions:
            - action: Sigkill
