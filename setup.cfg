[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short --strict-markers

[coverage:run]
source = src/claude_skills

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == "__main__":
    raise NotImplementedError
    pass
    return 0

[tool:mypy]
python_version = 3.9
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false

[tool:ruff]
line-length = 140
target-version = py39

[tool:ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]
