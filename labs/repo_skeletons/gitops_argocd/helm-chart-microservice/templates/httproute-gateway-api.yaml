{{- if .Values.gatewayRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayRoute.gatewayName }}
      namespace: {{ .Values.gatewayRoute.gatewayNamespace }}
  hostnames:
    - {{ .Values.gatewayRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
